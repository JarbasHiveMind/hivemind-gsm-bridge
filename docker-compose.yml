version: "3.8"

services:
  hivemind-gsm-bridge:
    build: .
    image: hivemind-gsm-bridge
    restart: unless-stopped
    # the modem is a physical serial device; it must be passed through
    # from the host, not created by the container.
    devices:
      - "${GSM_PORT:-/dev/ttyUSB0}:${GSM_PORT:-/dev/ttyUSB0}"
    environment:
      GSM_PORT: "${GSM_PORT:-/dev/ttyUSB0}"
      GSM_BAUD: "${GSM_BAUD:-115200}"
      # only set this if the SIM requires a PIN. Do NOT commit a real
      # value here; set it in a .env file or the deployment's secret store.
      SIM_PIN: "${SIM_PIN}"
      # HiveMind hub credentials, see `hivemind-core add-client`.
      HIVEMIND_ACCESS_KEY: "${HIVEMIND_ACCESS_KEY}"
      HIVEMIND_PASSWORD: "${HIVEMIND_PASSWORD}"
      HIVEMIND_HOST: "${HIVEMIND_HOST:-ws://hivemind-core}"
      HIVEMIND_PORT: "${HIVEMIND_PORT:-5678}"
      HIVEMIND_SITE_ID: "${HIVEMIND_SITE_ID:-gsm}"
      HIVEMIND_LANG: "${HIVEMIND_LANG:-en-us}"
    # if hivemind-core runs as another compose service, uncomment:
    # depends_on:
    #   - hivemind-core
